spdx-elements:
  - id: SPDXRef-mesa-api
    name: "LIB: MESA"
    directory: .
    license: MIT
    copyright: >-
      Copyright (c) 2004-2024 Microsemi Corporation "Microsemi";
      Copyright (c) 2004-2022 Microchip Technology Inc. and its subsidiaries.
    download_location: git+https://github.com/microchip-ung/mesa.git
    source_info: Microchip internal development
    use_packet_version: true
    description: >-
      MSCC Ethernet Switch API (MESA) and Ethernet PHY API (MEPA); the C library
      that is the MESA deliverable.

  # The buildroot 'xstax' root filesystem embedded in the bootable demo images,
  # one per arch. Its component breakdown is imported (merged) from the BSP's own
  # SPDX at release time via --ext-spdx <provider>:<path>; the release generator
  # attaches each to the bootable images under bin/<arch>/.
  - id: SPDXRef-brsdk-rootfs-arm
    name: "Buildroot rootfs (arm)"
    license: NOASSERTION
    description: Buildroot/xstax root filesystem embedded in the arm bootable images.
    external-spdx:
      provider: brsdk-arm
      import: SPDXRef-family-xstax
  - id: SPDXRef-brsdk-rootfs-arm64
    name: "Buildroot rootfs (arm64)"
    license: NOASSERTION
    description: Buildroot/xstax root filesystem embedded in the arm64 bootable images.
    external-spdx:
      provider: brsdk-arm64
      import: SPDXRef-family-xstax
  - id: SPDXRef-brsdk-rootfs-mipsel
    name: "Buildroot rootfs (mipsel)"
    license: NOASSERTION
    description: Buildroot/xstax root filesystem embedded in the mipsel bootable images.
    external-spdx:
      provider: brsdk-mipsel
      import: SPDXRef-family-xstax
