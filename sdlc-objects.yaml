---
# MESA (MSCC Ethernet Switch API) is the shipped switch library. Every per-chip
# <LIB>_static build target is the same library compiled for a different chip,
# so they all map to the single SPDXRef-mesa-api component. MESA is a switch API
# and does not contain the PHY/utility components: the PHY drivers (Intel GPY211,
# Aquantia, Microchip LAN80xx + its vendored SHA-256) are attributed to their own
# mepa_drv_* cmake targets under mepa/, and lm_utils is its own component under
# utils/ -- each via its own sdlc-objects.yaml, not force-added here.

cmake-targets:
  # Internal build-time code-generation targets (produce the mesa-ag wrapper).
  # Not shipped components -- transparent records so coverage passes now that the
  # MESA libraries depend on mesa_src explicitly.
  - id: cmake-target-mesa_src
    name: mesa_src
  - id: cmake-target-mesa_cache
    name: mesa_cache

  - id: cmake-target-lan966x_static
    name: lan966x_static
    spdx-id: SPDXRef-mesa-api
