---
# MESA (MSCC Ethernet Switch API) is the shipped library. Every per-chip
# <LIB>_static build target is the same library compiled for a different chip,
# so they all map to the single SPDXRef-mesa-api component. The third-party that
# compiles into the library (utils and the vendored PHY/crypto drivers) is
# attached via sbom_add_kids, as it is not built as separate cmake targets.

cmake-targets:
  - id: cmake-target-lan966x_static
    name: lan966x_static
    spdx-id: SPDXRef-mesa-api
