---
# The MEPA collection libraries. Each MEPA_LIB(...) in mepa/CMakeLists.txt emits
# three cmake targets -- <name>, <name>_target and <name>_common -- all
# transparent pass-throughs; the PHY components are attributed by the per-PHY
# drivers under mepa/microchip, mepa/aqr and mepa/intel.

cmake-targets:

  # MEPA_LIB: mepa
  - id: cmake-target-mepa
    name: mepa
  - id: cmake-target-mepa_target
    name: mepa_target
  - id: cmake-target-mepa_common
    name: mepa_common

